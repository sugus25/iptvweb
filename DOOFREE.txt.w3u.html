<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realistic Digital Clock - Fullscreen 7 Days Background</title>
    <link href="https://fonts.bunny.net/css?family=Open+Sans:400,700,900" rel="stylesheet" type="text/css">
    
<style>
    /* บังคับให้ html และ body เต็มจอ 100% ไม่มีขอบล้น */
    html, body {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
    }

    body {
        background-color: #023a6e; /* สีสำรอง */
        
        /* คำสั่งบังคับรูปภาพให้ขยายเต็มหน้าจอ 100% */
        background-size: cover !important;
        background-position: center center !important;
        background-repeat: no-repeat !important;
        background-attachment: fixed !important; 
        
        /* เอฟเฟกต์เปลี่ยนรูปนุ่มนวล */
        transition: background-image 1s ease-in-out;
        
        display: flex;
        justify-content: center;
        align-items: center;
        color: #ddd; 
    }

	#clock-panel {
				background-color: rgba(0, 0, 0, 0.4); 
				padding: 30px 40px;
				border-radius: 15px;
				border: 2px solid rgba(255, 255, 255, 0.1); 
				box-shadow: 0 15px 35px rgba(0,0,0,0.5); 
				width: 90vw;
				max-width: 1100px; 
				font-family: 'Open Sans', sans-serif;
				text-align: center;
				backdrop-filter: blur(5px); 
			}

    #time-display {
        display: flex;
        justify-content: center;
        align-items: baseline;
        margin-bottom: 25px;
    }

    .digit {
        font-family: 'Arial Black', Gadget, sans-serif; 
        font-size: 15vw; 
        font-weight: bold;
        color: #ff3333; 
        line-height: 1;
        letter-spacing: -2px; 
        
        -webkit-text-stroke: 3px #000000; 
        text-shadow: 0 0 5px rgba(255, 0, 0, 0.6), 0 0 10px rgba(255, 0, 0, 0.3);
    }

    .separator {
        font-size: 10vw;
        margin: 0 15px;
        color: #ff3333;
        animation: blink 1s ease infinite; 
        
        -webkit-text-stroke: 2px #000000;
        text-shadow: 0 0 5px rgba(255, 0, 0, 0.6);
    }

    #data-panel {
        display: flex;
        justify-content: space-between; 
        align-items: center;
        padding-top: 20px;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        flex-wrap: wrap; 
        gap: 15px;
    }

    .data-item {
        text-align: left;
        display: flex;
        flex-direction: column;
        align-items: center; 
    }

    .label {
        font-size: 11px;
        color: #aaa; 
        text-transform: uppercase;
        letter-spacing: 2px;
        font-weight: 700;
        text-shadow: 1px 1px 2px rgba(0,0,0,0.8); 
    }

    .value {
        font-size: 26px;
        color: gold; 
        font-weight: bold;
        text-shadow: 1px 1px 3px rgba(0,0,0,0.8); 
        margin-top: 2px;
    }

    .temp-val {
        color: #ff3333;
        font-family: 'Arial Black', sans-serif;
        text-shadow: 1px 1px 3px rgba(0,0,0,0.8); 
    }

    .days-container {
        display: flex;
        gap: 10px;
        padding-left: 10px;
        border-left: 1px solid rgba(255,255,255,0.1); 
    }

    .day-indicator {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
    }

    .led {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background-color: #330000; 
        box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
        transition: all 0.3s ease;
    }

    .led.active {
        background-color: #ff0000; 
        box-shadow: 0 0 10px #ff0000, 0 0 20px #ff0000, inset 0 0 5px white; 
    }

    .day-label {
        font-size: 10px;
        color: #ddd;
        font-weight: 900;
        letter-spacing: 1px;
        text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
    }

    @media (min-width: 1200px) {
        .digit { font-size: 160px; }
        .separator { font-size: 100px; }
        .value { font-size: 30px; }
        .led { width: 14px; height: 14px; }
    }

    @media (max-width: 900px) {
        #data-panel { justify-content: center; gap: 20px; }
        .days-container { 
            width: 100%; 
            justify-content: center; 
            border-left: none; 
            padding-top: 10px; 
        }
        .value { font-size: 22px; }
        .digit { font-size: 18vw; }
        .separator { font-size: 12vw; margin: 0 5px; }
    }

    @keyframes blink {
        50% { opacity: 0; }
    }
</style>
<style id="sb_dark_style">img{-webkit-filter:brightness(70%);}</style><style id="sb_cln_style">ins[class*="adsbygoogle"],ins[class*="adsbyadop"],[id*="div-gpt-ad"],amp-ad{display:none !important;}</style></head>
<body style="background-image: url(&quot;https://www.printwallpaper.net/wp-content/uploads/2021/10/00-cover-2.jpg&quot;);">

    <div id="clock-panel">
        <div id="time-display">
            <span class="digit" id="hours">09</span>
            <span class="separator">:</span>
            <span class="digit" id="minutes">52</span>
            <span class="separator">:</span>
            <span class="digit" id="seconds">21</span>
        </div>

        <div id="data-panel">
            <div class="data-item">
                <div class="label">DATE</div>
                <div class="value" id="date">15</div>
            </div>
            <div class="data-item">
                <div class="label">MONTH</div>
                <div class="value" id="month">05</div>
            </div>
            <div class="data-item">
                <div class="label">YEAR</div>
                <div class="value" id="year">2026</div>
            </div>
            <div class="data-item">
                <div class="label">PERIOD</div>
                <div class="value" id="ampm">PM</div>
            </div>
            <div class="data-item">
                <div class="label">TEMP</div>
                <div class="value temp-val"><span id="temp-value">29</span><span style="font-size: 16px;">°C</span></div>
            </div>
            
            <div class="days-container">
                <div class="day-indicator"><div class="led" id="led-0"></div><div class="day-label">SUN</div></div>
                <div class="day-indicator"><div class="led" id="led-1"></div><div class="day-label">MON</div></div>
                <div class="day-indicator"><div class="led" id="led-2"></div><div class="day-label">TUE</div></div>
                <div class="day-indicator"><div class="led" id="led-3"></div><div class="day-label">WED</div></div>
                <div class="day-indicator"><div class="led" id="led-4"></div><div class="day-label">THU</div></div>
                <div class="day-indicator"><div class="led active" id="led-5"></div><div class="day-label">FRI</div></div>
                <div class="day-indicator"><div class="led" id="led-6"></div><div class="day-label">SAT</div></div>
            </div>
        </div>
    </div>

<script>
    // รูปภาพ 7 วัน เรียงจาก วันอาทิตย์ (0) ถึง วันเสาร์ (6)
    const bgImages = [
        "https://images.dmc.tv/wallpaper/raw/14169.jpg", // วันอาทิตย์ (SUN)
        "https://images.dmc.tv/wallpaper/raw/13776.jpg", // วันจันทร์ (MON)
        "https://images.dmc.tv/wallpaper/raw/13748.jpg", // วันอังคาร (TUE)
        "https://images.dmc.tv/wallpaper/raw/13826.jpg", // วันพุธ (WED)
        "https://images.wallpapersden.com/image/download/moscow-city-at-night_a2trbmeUmZqaraWkpJRmbmdlrWZlbWU.jpg", // วันพฤหัสบดี (THU)
        "https://www.printwallpaper.net/wp-content/uploads/2021/10/00-cover-2.jpg", // วันศุกร์ (FRI)
        "https://wallpapercat.com/w/full/d/f/7/293062-3840x2160-desktop-4k-new-york-background-photo.jpg"  // วันเสาร์ (SAT)
    ];

    let currentBgDay = -1; 

    function updateClock() {
        const now = new Date();
        
        let hours = now.getHours();
        const minutes = String(now.getMinutes()).padStart(2, '0');
        const seconds = String(now.getSeconds()).padStart(2, '0');
        const ampm = hours >= 12 ? 'PM' : 'AM';
        
        hours = hours % 12;
        hours = hours ? hours : 12; 
        const hourString = String(hours).padStart(2, '0');

        document.getElementById('hours').textContent = hourString;
        document.getElementById('minutes').textContent = minutes;
        document.getElementById('seconds').textContent = seconds;
        document.getElementById('ampm').textContent = ampm;

        document.getElementById('date').textContent = String(now.getDate()).padStart(2, '0');
        document.getElementById('month').textContent = String(now.getMonth() + 1).padStart(2, '0'); 
        document.getElementById('year').textContent = now.getFullYear();

        const currentDay = now.getDay();

        for(let i = 0; i <= 6; i++) {
            document.getElementById('led-' + i).classList.remove('active');
        }
        document.getElementById('led-' + currentDay).classList.add('active');

        // ตรวจสอบและอัปเดตพื้นหลังเมื่อเปลี่ยนวัน (หรือตอนเปิดเว็บครั้งแรก)
        if (currentBgDay !== currentDay) {
            document.body.style.backgroundImage = `url('${bgImages[currentDay]}')`;
            currentBgDay = currentDay;
        }
    }

    function updateTemperature() {
        // ใส่พิกัด (ละติจูด, ลองจิจูด) ตรงนี้
        const lat = 13.7563;
        const lon = 100.5018;
        const apiUrl = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`;
        
        fetch(apiUrl)
            .then(response => response.json())
            .then(data => {
                const temp = Math.round(data.current_weather.temperature);
                document.getElementById('temp-value').textContent = temp;
            })
            .catch(error => {
                console.error("ไม่สามารถดึงข้อมูลได้:", error);
                document.getElementById('temp-value').textContent = "--";
            });
    }

    updateClock(); 
    updateTemperature();

    setInterval(updateClock, 1000); 
    setInterval(updateTemperature, 30 * 60 * 1000); 
</script>

</body>
