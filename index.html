<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>📺 IPTV Player — M3U/JSON/W3U + เลือกแอปเอง</title>
  
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.21/dist/hls.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dashjs@4.7.4/dist/dash.all.min.js"></script>
  
  <style>
    :root {
      --bg: #12121f; --s1: #1e1e2f; --s2: #2a2a3f; --s3: #353550;
      --b1: rgba(255,255,255,0.08); --b2: rgba(255,255,255,0.12);
      --accent: #00c8ff; --accent2: #7b2ffd;
      --t1: #f0f0ff; --t2: #a0a0c0; --t3: #606080;
      --ok: #00d887; --danger: #ff4757; --warn: #ffa502;
      --blue: #2563eb;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background: var(--bg); color: var(--t1); min-height: 100vh; padding: 16px; }

    .container { max-width: 600px; margin: 0 auto; }
    h1 { text-align: center; margin-bottom: 20px; color: var(--accent); font-size: 20px; }

    /* ===== 🎬 เครื่องเล่น ===== */
    .video-box { background: #000; border-radius: 12px; overflow: hidden; margin-bottom: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.5); display: none; }
    .video-wrap { width: 100%; aspect-ratio: 16/9; background: #000; position: relative; overflow: hidden; }
    video, iframe { width: 100%; height: 100%; display: block; border: none; }
    video { object-fit: contain; }
    .web-view { width: 100%; height: 100%; border: none; }

    /* ===== 📐 ปรับขนาดหน้าจอ ===== */
    .mode-bar { display: flex; flex-wrap: wrap; gap: 6px; padding: 12px; background: var(--s2); border-top: 1px solid var(--b1); }
    .mode-label { width: 100%; font-size: 12px; color: var(--t2); margin-bottom: 4px; }
    .mode-btn { flex: 1; min-width: 75px; padding: 8px 6px; border-radius: 6px; border: 1px solid var(--b1); background: var(--s3); color: var(--t2); cursor: pointer; font-size: 12px; transition: 0.2s; }
    .mode-btn:hover { border-color: var(--accent); color: var(--accent); }
    .mode-btn.active { background: linear-gradient(135deg, var(--accent), var(--accent2)); border-color: transparent; color: #fff; }

    /* ===== 📋 ฟอร์ม ===== */
    .form-card { background: var(--s1); border-radius: 12px; padding: 20px; border: 1px solid var(--b1); margin-bottom: 16px; }
    .section-title { font-size: 15px; font-weight: 600; margin-bottom: 12px; color: var(--accent); }

    /* ===== แท็บ ===== */
    .tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    .tab { flex: 1; min-width: 100px; padding: 10px; border-radius: 8px; border: 1px solid transparent; background: var(--s2); color: var(--t2); cursor: pointer; font-size: 13px; text-align: center; transition: 0.2s; }
    .tab.active { background: var(--blue); color: #fff; border-color: var(--blue); }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* ===== ประเภทลิงก์ ===== */
    .type-bar { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
    .type-btn { padding: 8px 12px; border-radius: 6px; border: 2px solid transparent; background: var(--s2); color: var(--t2); cursor: pointer; font-size: 13px; font-weight: 500; transition: 0.2s; }
    .type-btn:hover { border-color: var(--accent); color: var(--accent); }
    .type-btn.active { background: var(--blue); border-color: var(--blue); color: #fff; box-shadow: 0 2px 8px rgba(37,99,235,0.3); }

    /* ===== ช่องกรอกข้อมูล ===== */
    .input-group { margin-bottom: 14px; }
    .label { display: block; margin-bottom: 6px; color: var(--t2); font-size: 13px; }
    .input-wrap { position: relative; display: flex; align-items: center; }
    .input-field { width: 100%; padding: 12px 44px 12px 14px; border-radius: 8px; border: 1px solid var(--b2); background: var(--s2); color: var(--t1); font-size: 14px; outline: none; transition: 0.2s; font-family: monospace; word-break: break-all; }
    .input-field:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0,200,255,0.15); }
    .paste-btn { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); padding: 8px 10px; border-radius: 6px; border: none; background: var(--accent2); color: #fff; cursor: pointer; font-size: 13px; transition: 0.2s; }
    .paste-btn:hover { background: #6b21d8; }

    /* ===== ปุ่มทดสอบเล่น ===== */
    .play-btn { width: 100%; padding: 14px; border-radius: 10px; border: none; background: linear-gradient(135deg, #00c8ff, #7b2ffd); color: #fff; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 4px; }
    .play-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,200,255,0.25); }
    .play-btn span { font-size: 20px; }

    /* ===== สถานะ ===== */
    .status { margin-top: 14px; padding: 12px 16px; border-radius: 8px; font-size: 14px; display: none; }
    .status.show { display: block; }
    .status.ok { background: rgba(0,216,135,0.1); border: 1px solid var(--ok); color: var(--ok); }
    .status.err { background: rgba(255,71,87,0.1); border: 1px solid var(--danger); color: var(--danger); }
    .status.warn { background: rgba(255,165,2,0.1); border: 1px solid var(--warn); color: var(--warn); }

    /* ===== 📂 หมวดหมู่ ===== */
    .category-bar { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; padding-bottom: 12px; border-bottom: 1px solid var(--b1); }
    .category-btn { padding: 8px 14px; border-radius: 20px; border: 1px solid var(--b1); background: var(--s2); color: var(--t2); cursor: pointer; font-size: 13px; transition: 0.2s; white-space: nowrap; }
    .category-btn:hover, .category-btn.active { background: var(--accent2); color: #fff; border-color: var(--accent2); }
    .category-all { background: linear-gradient(135deg, var(--accent), var(--accent2)); border: none; color: #fff; }

    /* ===== 📋 รายการช่อง ===== */
    .playlist-box { background: var(--s1); border-radius: 12px; padding: 16px; border: 1px solid var(--b1); margin-top: 16px; display: none; }
    .playlist-box.show { display: block; }
    .playlist-title { font-size: 16px; font-weight: 600; margin-bottom: 8px; color: var(--accent); }
    .ch-item { padding: 12px 14px; border-radius: 8px; background: var(--s2); border: 1px solid var(--b1); cursor: pointer; transition: 0.2s; margin-bottom: 8px; font-size: 14px; }
    .ch-item.hidden { display: none; }
    .ch-item:hover { background: var(--s3); border-color: var(--accent); transform: translateX(4px); }
    .ch-item.playing { border-color: var(--accent); background: rgba(0,200,255,0.1); }

    /* ===== ปุ่มเปิดภายนอก ===== */
    .ext-bar { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
    .ext-btn { padding: 14px 8px; border-radius: 10px; border: none; cursor: pointer; font-size: 14px; font-weight: 600; color: #fff; transition: 0.2s; }
    .ext-btn:hover { transform: translateY(-2px); }
    .ext-open { background: linear-gradient(135deg, #f97316, #ea580c); }
    .ext-copy { background: linear-gradient(135deg, #10b981, #059669); }
    .ext-copy.copied { background: #4ade80; color: #000; }

    /* ===== มือถือ ===== */
    @media (max-width: 480px) {
      body { padding: 12px; }
      .type-btn { padding: 7px 10px; font-size: 12px; }
      .mode-btn { min-width: 65px; padding: 7px 4px; font-size: 11px; }
      .ext-bar { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>

<div class="container">
  <h1>📺 IPTV Player — M3U / JSON / W3U</h1>

  <!-- ===== 🎬 เครื่องเล่น ===== -->
  <div class="video-box" id="videoBox">
    <div class="video-wrap" id="videoWrap">
      <video id="video" controls playsinline preload="metadata" style="display: none;"></video>
      <iframe id="webIframe" class="web-view" style="display: none;" allow="autoplay; fullscreen; picture-in-picture"></iframe>
    </div>

    <!-- 📐 ปรับขนาดหน้าจอ -->
    <div class="mode-bar">
      <span class="mode-label">📐 โหมดแสดงภาพ — กำจัดขอบดำ</span>
      <button class="mode-btn active" data-mode="contain">⚙ Contain</button>
      <button class="mode-btn" data-mode="cover">🔍 Cover</button>
      <button class="mode-btn" data-mode="fill">↔️ Stretch</button>
      <button class="mode-btn" data-mode="16:9">📺 16:9</button>
      <button class="mode-btn" data-mode="full">⛶ เต็มจอ</button>
    </div>
  </div>

  <!-- ===== 📋 ฟอร์ม ===== -->
  <div class="form-card">
    <!-- แท็บ: เล่นตรง / โหลดเพลย์ลิสต์ -->
    <div class="tabs">
      <div class="tab active" data-tab="direct">▶ เล่นตรง</div>
      <div class="tab" data-tab="playlist">📋 โหลดเพลย์ลิสต์</div>
    </div>

    <!-- ===== แท็บ 1: เล่นตรง ===== -->
    <div class="tab-content active" id="tab-direct">
      <div class="section-title">เลือกประเภทลิงก์</div>
      <div class="type-bar">
        <button class="type-btn" data-type="web_url">🌐 เว็บ</button>
        <button class="type-btn active" data-type="m3u8">📹 m3u8</button>
        <button class="type-btn" data-type="mp4">🎥 mp4</button>
        <button class="type-btn" data-type="mpd">📊 mpd</button>
      </div>

      <div class="input-group">
        <label class="label">🔗 ลิงก์วิดีโอ (URL)</label>
        <div class="input-wrap">
          <input type="text" class="input-field" id="urlInput" placeholder="วางลิงก์ที่นี่...">
          <button class="paste-btn" id="pasteUrlBtn">วาง</button>
        </div>
      </div>

      <div class="input-group">
        <label class="label">Referer (ถ้ามี)</label>
        <div class="input-wrap">
          <input type="text" class="input-field" id="refererInput" placeholder="https://example.com">
          <button class="paste-btn" id="pasteRefBtn">วาง</button>
        </div>
      </div>

      <button class="play-btn" id="testBtn">
        <span>▶</span> ทดสอบเล่น
      </button>
    </div>

    <!-- ===== แท็บ 2: โหลดเพลย์ลิสต์ .m3u / .json / .w3u ===== -->
    <div class="tab-content" id="tab-playlist">
      <div class="section-title">📥 โหลดเพลย์ลิสต์ — รองรับ .m3u / .json / .w3u</div>
      
      <div class="input-group">
        <label class="label">🔗 ลิงก์ไฟล์เพลย์ลิสต์</label>
        <div class="input-wrap">
          <input type="text" class="input-field" id="playlistUrlInput" placeholder="วางลิงก์ .m3u / .json / .w3u ที่นี่...">
          <button class="paste-btn" id="pastePlaylistBtn">วาง</button>
        </div>
      </div>

      <button class="play-btn" id="loadPlaylistBtn">
        <span>📥</span> โหลดเพลย์ลิสต์
      </button>
    </div>

    <!-- สถานะ -->
    <div class="status" id="status"></div>

    <!-- ปุ่มเปิดภายนอก -->
    <div class="ext-bar" id="extBar" style="display: none;">
      <button class="ext-btn ext-open" id="openInAppBtn">📱 เปิดในแอปอื่น</button>
      <button class="ext-btn ext-copy" id="copyBtn">📋 คัดลอก</button>
    </div>
  </div>

  <!-- ===== 📋 รายการช่อง ===== -->
  <div class="playlist-box" id="playlistBox">
    <div class="playlist-title">📋 รายการช่อง <span id="chCount"></span></div>
    
    <!-- 📂 หมวดหมู่ -->
    <div class="category-bar" id="categoryBar">
      <button class="category-btn category-all active" data-category="all">📺 ทุกช่อง</button>
    </div>
    
    <div id="channelsList"></div>
  </div>
</div>

<script>
// ==============================================
// 🎯 ตัวแปรหลัก
// ==============================================
const video = document.getElementById('video');
const webIframe = document.getElementById('webIframe');
const videoBox = document.getElementById('videoBox');
const extBar = document.getElementById('extBar');
const status = document.getElementById('status');
const playlistBox = document.getElementById('playlistBox');
const categoryBar = document.getElementById('categoryBar');
const channelsList = document.getElementById('channelsList');

let hls = null, dashPlayer = null;
let currentType = 'm3u8';
let currentUrl = '';
let currentReferer = '';
let allChannels = [];
let categories = [];
let activeCategory = 'all';

// ==============================================
// 📱 สลับแท็บ
// ==============================================
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    document.getElementById(`tab-${tab.dataset.tab}`).classList.add('active');
  });
});

// ==============================================
// 📐 ปรับโหมดภาพ
// ==============================================
document.querySelectorAll('.mode-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    setMode(btn.dataset.mode);
  });
});

function setMode(mode) {
  video.style.objectFit = 'contain';
  videoWrap.style.aspectRatio = '16/9';
  videoWrap.style.borderRadius = '12px';
  videoWrap.style.width = '100%';
  videoWrap.style.height = '';

  switch(mode) {
    case 'contain': video.style.objectFit = 'contain'; break;
    case 'cover': video.style.objectFit = 'cover'; break;
    case 'fill': video.style.objectFit = 'fill'; break;
    case '16:9': video.style.objectFit = 'contain'; videoWrap.style.aspectRatio = '16/9'; break;
    case 'full':
      video.style.objectFit = 'contain';
      videoWrap.style.aspectRatio = 'unset';
      videoWrap.style.borderRadius = '0';
      videoWrap.style.width = '100vw';
      videoWrap.style.height = '100vh';
      if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
      break;
  }
}

// ==============================================
// 📋 เลือกประเภทลิงก์
// ==============================================
document.querySelectorAll('.type-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentType = btn.dataset.type;
    showStatus(`✅ เลือกประเภท: ${currentType}`, 'ok');
  });
});

// ==============================================
// 📋 ปุ่มวางข้อมูล
// ==============================================
async function pasteTo(inputId) {
  try {
    const text = await navigator.clipboard.readText();
    document.getElementById(inputId).value = text.trim();
    showStatus('✅ วางข้อมูลแล้ว', 'ok');
  } catch (e) {
    showStatus('⚠️ ไม่สามารถอ่านคลิปบอร์ดได้', 'warn');
  }
}

document.getElementById('pasteUrlBtn').addEventListener('click', () => pasteTo('urlInput'));
document.getElementById('pasteRefBtn').addEventListener('click', () => pasteTo('refererInput'));
document.getElementById('pastePlaylistBtn').addEventListener('click', () => pasteTo('playlistUrlInput'));

// ==============================================
// ▶️ ทดสอบเล่น — เล่นตรง
// ==============================================
document.getElementById('testBtn').addEventListener('click', () => {
  const url = document.getElementById('urlInput').value.trim();
  const referer = document.getElementById('refererInput').value.trim();

  if (!url) return showStatus('⚠️ กรุณาใส่ลิงก์ URL', 'err');

  currentUrl = url;
  currentReferer = referer;

  showStatus('⏳ กำลังโหลด...', 'warn');
  stopAll();
  videoBox.style.display = 'none';
  extBar.style.display = 'none';

  switch (currentType) {
    case 'web_url': playWebUrl(url); break;
    case 'm3u8': playHLS(url, referer); break;
    case 'mp4': playMP4(url); break;
    case 'mpd': playDASH(url); break;
    default: autoDetectAndPlay(url, referer);
  }
});

// ==============================================
// 📥 โหลดเพลย์ลิสต์ — .m3u / .json / .w3u
// ==============================================
document.getElementById('loadPlaylistBtn').addEventListener('click', async () => {
  const url = document.getElementById('playlistUrlInput').value.trim();
  if (!url) return showStatus('⚠️ กรุณาใส่ลิงก์ไฟล์เพลย์ลิสต์', 'err');
  
  showStatus('⏳ กำลังโหลดเพลย์ลิสต์...', 'warn');
  allChannels = [];
  categories = [];
  playlistBox.classList.remove('show');
  
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error('Load failed');
    const text = await res.text();
    
    // ✅ ตรวจประเภทไฟล์อัตโนมัติ
    if (url.endsWith('.m3u') || url.endsWith('.m3u8') || text.startsWith('#EXTM3U')) {
      parseM3U(text);
      showStatus(`✅ โหลด M3U สำเร็จ! ทั้งหมด ${allChannels.length} ช่อง`, 'ok');
    } 
    else if (url.endsWith('.json') || url.endsWith('.w3u') || text.trim().startsWith('{') || text.trim().startsWith('[')) {
      try {
        const json = JSON.parse(text);
        parseJsonW3U(json);
        showStatus(`✅ โหลด ${url.endsWith('.w3u') ? 'W3U' : 'JSON'} สำเร็จ! ทั้งหมด ${allChannels.length} ช่อง`, 'ok');
      } catch (e) {
        showStatus('❌ รูปแบบ JSON/W3U ไม่ถูกต้อง', 'err');
        return;
      }
    } 
    else {
      // ลองเดาแบบอัตโนมัติ
      if (text.startsWith('#EXTM3U')) {
        parseM3U(text);
        showStatus(`✅ ตรวจพบรูปแบบ M3U — โหลดสำเร็จ! ${allChannels.length} ช่อง`, 'ok');
      } else if (text.trim().startsWith('{') || text.trim().startsWith('[')) {
        const json = JSON.parse(text);
        parseJsonW3U(json);
        showStatus(`✅ ตรวจพบรูปแบบ JSON/W3U — โหลดสำเร็จ! ${allChannels.length} ช่อง`, 'ok');
      } else {
        throw new Error('Unknown format');
      }
    }
    
    renderCategories();
    renderChannels();
    playlistBox.classList.add('show');
    
  } catch (e) {
    console.error(e);
    showStatus('⚠️ ถูกบล็อก CORS หรือลิงก์ไม่ถูกต้อง — ลองเปิดลิงก์ในเบราว์เซอร์ดูก่อนครับ', 'err');
  }
});

// ==============================================
// 🔧 แปลงข้อมูล M3U
// ==============================================
function parseM3U(text) {
  allChannels = [];
  const lines = text.split('\n');
  let ch = { name: '', url: '', logo: '', group: 'ทั่วไป' };
  
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i].trim();
    if (line.startsWith('#EXTINF:')) {
      const nameMatch = line.match(/,(.+)$/);
      const logoMatch = line.match(/tvg-logo="([^"]*)"/);
      const groupMatch = line.match(/group-title="([^"]*)"/);
      ch = {
        name: nameMatch ? nameMatch[1].trim() : 'ไม่ระบุ',
        logo: logoMatch ? logoMatch[1] : '',
        group: groupMatch ? groupMatch[1].trim() : 'ทั่วไป',
        url: ''
      };
    } else if (line && !line.startsWith('#') && line.startsWith('http')) {
      ch.url = line;
      allChannels.push({ ...ch });
      ch = { name: '', url: '', logo: '', group: 'ทั่วไป' };
    }
  }
  
  categories = [...new Set(allChannels.map(c => c.group))].sort();
}

// ==============================================
// 🔧 แปลงข้อมูล JSON / W3U
// ==============================================
function parseJsonW3U(json) {
  allChannels = [];
  
  // ✅ รูปแบบ W3U / GUFLIX / Madooball style
  if (json.groups || json.name || json.stations || Array.isArray(json)) {
    let groups = [];
    
    if (json.groups) {
      groups = json.groups;
    } else if (Array.isArray(json)) {
      groups = json;
    } else {
      groups = [json];
    }
    
    groups.forEach(group => {
      const groupName = group.name || group.groupName || 'ทั่วไป';
      const stations = group.stations || group.channels || group.links || [];
      
      stations.forEach(st => {
        let streamUrl = st.url || st.link || st.stream || st.src || '';
        
        // แยก Referer ถ้ามีในรูปแบบ |referer=...
        if (streamUrl.includes('|')) {
          const parts = streamUrl.split('|');
          streamUrl = parts[0];
        }
        
        if (streamUrl && streamUrl.startsWith('http')) {
          allChannels.push({
            name: st.name || st.title || st.channelName || 'ไม่ระบุ',
            url: streamUrl,
            logo: st.image || st.logo || st.logoUrl || '',
            group: groupName
          });
        }
      });
    });
  }
  
  // ✅ รูปแบบ JSON แบบอื่นๆ
  else if (json.channels) {
    json.channels.forEach(ch => {
      if (ch.url && ch.url.startsWith('http')) {
        allChannels.push({
          name: ch.name || ch.title || 'ไม่ระบุ',
          url: ch.url,
          logo: ch.logo || ch.image || '',
          group: ch.group || ch.category || 'ทั่วไป'
        });
      }
    });
  }
  
  categories = [...new Set(allChannels.map(c => c.group))].sort();
}

// ==============================================
// 📂 แสดงหมวดหมู่
// ==============================================
function renderCategories() {
  categoryBar.innerHTML = `<button class="category-btn category-all active" data-category="all">📺 ทุกช่อง</button>`;
  
  categories.forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'category-btn';
    btn.textContent = cat;
    btn.dataset.category = cat;
    btn.addEventListener('click', () => filterByCategory(cat));
    categoryBar.appendChild(btn);
  });
  
  document.querySelector('.category-all').onclick = () => filterByCategory('all');
}

function filterByCategory(cat) {
  activeCategory = cat;
  document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
  document.querySelector(`[data-category="${cat}"]`).classList.add('active');
  
  channelsList.querySelectorAll('.ch-item').forEach((item, idx) => {
    const ch = allChannels[idx];
    if (cat === 'all' || ch.group === cat) item.classList.remove('hidden');
    else item.classList.add('hidden');
  });
}

// ==============================================
// 📋 แสดงรายการช่อง
// ==============================================
function renderChannels() {
  document.getElementById('chCount').textContent = `(${allChannels.length} ช่อง)`;
  channelsList.innerHTML = '';
  
  allChannels.forEach((ch, idx) => {
    const item = document.createElement('div');
    item.className = 'ch-item';
    item.textContent = ch.name;
    item.dataset.index = idx;
    item.onclick = () => playChannel(idx);
    channelsList.appendChild(item);
  });
}

// ==============================================
// 🎬 เล่นช่องจากเพลย์ลิสต์
// ==============================================
function playChannel(index) {
  const ch = allChannels[index];
  
  document.querySelectorAll('.ch-item').forEach((item, idx) => {
    item.classList.toggle('playing', idx === index);
  });
  
  document.getElementById('urlInput').value = ch.url;
  document.querySelector('[data-tab="direct"]').click();
  
  currentUrl = ch.url;
  currentReferer = '';
  stopAll();
  videoBox.style.display = 'none';
  extBar.style.display = 'none';
  autoDetectAndPlay(ch.url, '');
}

// ==============================================
// 🌐 เล่น web_url — เปิดใน iframe
// ==============================================
function playWebUrl(url) {
  videoBox.style.display = 'block';
  extBar.style.display = 'grid';
  
  video.style.display = 'none';
  webIframe.style.display = 'block';
  webIframe.src = url;
  
  showStatus('✅ กำลังโหลดหน้าเว็บ...', 'ok');
}

// ==============================================
// 🔄 ตรวจอัตโนมัติ
// ==============================================
function autoDetectAndPlay(url, referer) {
  const u = url.toLowerCase();
  if (u.includes('.m3u8')) { currentType = 'm3u8'; playHLS(url, referer); }
  else if (u.includes('.mpd')) { currentType = 'mpd'; playDASH(url); }
  else if (u.includes('.mp4') || u.includes('.webm')) { currentType = 'mp4'; playMP4(url); }
  else { currentType = 'web_url'; playWebUrl(url); }
}

// ==============================================
// 🎬 เล่น HLS (.m3u8)
// ==============================================
function playHLS(url, referer) {
  videoBox.style.display = 'block';
  extBar.style.display = 'grid';
  video.style.display = 'block';
  webIframe.style.display = 'none';

  if (video.canPlayType('application/vnd.apple.mpegurl')) {
    video.src = url;
    video.play().then(() => showStatus('✅ กำลังเล่น (Native HLS)', 'ok')).catch(() => showStatus('⚠️ คลิกเพื่อเริ่มเล่น', 'warn'));
    return;
  }

  if (Hls.isSupported()) {
    hls = new Hls({ maxBufferLength: 30, maxMaxBufferLength: 60,
      xhrSetup: (xhr) => { if (referer) xhr.setRequestHeader('Referer', referer); }
    });
    hls.loadSource(url);
    hls.attachMedia(video);

    hls.on(Hls.Events.MANIFEST_PARSED, () => {
      showStatus('✅ กำลังเล่น (HLS.js)', 'ok');
      video.play().catch(() => showStatus('⚠️ คลิกเพื่อเล่น', 'warn'));
    });

    hls.on(Hls.Events.ERROR, (_, data) => {
      if (data.fatal) showStatus('❌ ไม่สามารถโหลดได้ — ลิงก์อาจหมดอายุหรือถูกบล็อก', 'err');
    });
  } else {
    showStatus('❌ เบราว์เซอร์ไม่รองรับ HLS', 'err');
  }
}

// ==============================================
// 🎬 เล่น DASH (.mpd)
// ==============================================
function playDASH(url) {
  videoBox.style.display = 'block';
  extBar.style.display = 'grid';
  video.style.display = 'block';
  webIframe.style.display = 'none';

  dashPlayer = dashjs.MediaPlayer().create();
  dashPlayer.initialize(video, url, true);
  dashPlayer.on('streamInitialized', () => showStatus('✅ กำลังเล่น DASH', 'ok'));
  dashPlayer.on('error', () => showStatus('❌ DASH เล่นไม่ได้', 'err'));
}

// ==============================================
// 🎬 เล่น MP4
// ==============================================
function playMP4(url) {
  videoBox.style.display = 'block';
  extBar.style.display = 'grid';
  video.style.display = 'block';
  webIframe.style.display = 'none';

  video.src = url;
  video.play().then(() => showStatus('✅ กำลังเล่น MP4', 'ok'));
}

// ==============================================
// 🛑 หยุดทุกอย่าง
// ==============================================
function stopAll() {
  if (hls) { hls.destroy(); hls = null; }
  if (dashPlayer) { dashPlayer.reset(); dashPlayer = null; }
  video.removeAttribute('src');
  video.load();
  webIframe.src = 'about:blank';
}

// ==============================================
// 📱 เปิดในแอปอื่น — แก้ไขลิงก์ให้ถูกต้องก่อนส่ง
// ==============================================
document.getElementById('openInAppBtn').addEventListener('click', () => {
  let url = currentUrl || document.getElementById('urlInput').value.trim();
  if (!url) return alert('⚠️ ไม่มีลิงก์วิดีโอครับ กดทดสอบเล่นก่อนหรือใส่ลิงก์ก่อนครับ');

  // ✅ 1. ถอดรหัส URL ก่อน
  let cleanUrl = decodeURIComponent(url);

  // ✅ 2. ตัดส่วนเกินออก
  cleanUrl = cleanUrl.split('|')[0].split('#')[0];

  // ✅ 3. แยก Referer ออกมา
  let refererValue = '';
  const refererMatch = decodeURIComponent(url).match(/[?&|]referer=([^&|#]+)/);
  if (refererMatch) refererValue = decodeURIComponent(refererMatch[1]);

  // ✅ 4. สร้าง Intent ที่สะอาด
  let intentUrl = `intent:${encodeURI(cleanUrl)}#Intent;action=android.intent.action.VIEW;type=video/*;`;
  if (refererValue) intentUrl += `S.referer=${encodeURIComponent(refererValue)};`;
  intentUrl += `end`;

  window.location.href = intentUrl;

  setTimeout(() => {
    if (confirm('❌ ไม่สามารถเปิดแอปได้ หรือไม่มีแอปที่รองรับ\n✅ ต้องการคัดลอกลิงก์ไปวางในแอปเองไหม?')) {
      navigator.clipboard.writeText(cleanUrl).then(() => {
        alert('✅ คัดลอกลิงก์แล้วครับ!\n' + (refererValue ? `(มี Referer ด้วย)\n` : '') + 'เปิดแอปฯ → วางลิงก์เพื่อเล่นได้เลยครับ');
      });
    }
  }, 1200);
});

// ==============================================
// 📋 ปุ่มคัดลอกลิงก์
// ==============================================
document.getElementById('copyBtn').addEventListener('click', () => {
  const url = currentUrl || document.getElementById('urlInput').value.trim();
  if (!url) return alert('⚠️ ไม่มีลิงก์ให้คัดลอกครับ');
  navigator.clipboard.writeText(url).then(() => {
    const btn = document.getElementById('copyBtn');
    btn.classList.add('copied');
    btn.innerHTML = '✅ คัดลอก!';
    setTimeout(() => {
      btn.classList.remove('copied');
      btn.innerHTML = '📋 คัดลอก';
    }, 2000);
  });
});

// ==============================================
// 📊 แสดงสถานะ
// ==============================================
function showStatus(text, type = 'ok') {
  status.textContent = text;
  status.className = `status show ${type}`;
  if (type === 'ok') setTimeout(() => status.classList.remove('show'), 8000);
}
</script>
